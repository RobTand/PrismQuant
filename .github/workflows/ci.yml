# PrismaQuant CI — run the test suite on every push and pull request.
#
# WHY THIS EXISTS: five substantial pull requests (#13-#17) sat open for eleven
# days with nothing to run them, while `main` itself carried three failing
# doc-staleness tests that the project had deliberately written to catch exactly
# that kind of drift. Nobody was ignoring a red signal — there was no signal.
#
# WHAT IT CAN AND CANNOT COVER. Re-measured 2026-08-03 ON THE RUNNER, which is
# the number that matters here: the suite is ~2762 tests taking 10.5-14 min per
# interpreter with `CUDA_VISIBLE_DEVICES=""` (2762 passed, 96 skipped,
# 2 xfailed). The previous note in this header claimed 967 tests in ~51 s,
# measured on the reference box on 2026-07-28; the suite has roughly tripled
# since and an ARM workstation is not a free x86 runner, so that figure had
# become misleading in both directions. The `tests` job allows 30 min, so the
# margin is about 2x rather than the ~35x the old number implied — a further
# doubling of the suite is a timeout, not a slow build, and should raise
# `timeout-minutes` in the same PR. The skips are the CUDA-gated tests.
# GitHub-hosted runners have no GPU, so
# kernel numerics, real-checkpoint streaming and anything touching a served
# artifact remain a manual gate on the Spark — this is a correctness net for
# the allocator/solver/footprint/profile logic, which is where the PRs live and
# where a silent regression is hardest to notice.
#
# Action pins are exact patch tags, not floating major refs: a re-pointable ref
# is a supply-chain surface, and CI runs on every contributor's branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python }}, cpu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Floor and current. requires-python is >=3.11 (schemas.py needs
        # typing.NotRequired); the reference box runs
        # 3.12. Widen only when a version is actually exercised somewhere.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # CPU torch explicitly: the default PyPI wheel drags a full CUDA stack
      # (~2.5 GB of runner disk and minutes of download) that no test here can
      # use. Installed first so the project's own `torch>=2.6` is satisfied and
      # pip does not go looking for the CUDA build.
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install prismaquant + test extras
        run: python -m pip install -e '.[test]'

      # CUDA_VISIBLE_DEVICES is belt-and-braces: hosted runners have no GPU, but
      # this makes a local reproduction of a CI failure one env var away, and
      # keeps the skip set identical between here and a developer's box.
      - name: Run tests
        env:
          PYTHONPATH: .
          CUDA_VISIBLE_DEVICES: ""
        run: pytest tests/ -q --timeout=300 -p no:cacheprovider

  # Import hygiene: catches a module that only imports because the reference box
  # happens to have vLLM, a CUDA extension, or a stray sys.path entry. Cheap, and
  # it fails in a way that names the offending module.
  imports:
    name: import surface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install prismaquant
        run: python -m pip install -e .
      - name: Import the package entry points
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python -c "import prismaquant; print('prismaquant ok')"
          python -m prismaquant.allocator --help > /dev/null && echo "allocator CLI ok"

  # Cross-project compatibility without a source mirror. The one JSON pin is
  # immutable; PEP 610 proves the installed runtime came from that exact Git
  # commit. The packaged consumer contract is compared with PrismaQuant's
  # independent producer layout/rung source rather than copied into it. This
  # job is also the only place the K0.2 stage attestation is executed end to
  # end: one process emits a routed-MoE record here and parses it there, so a
  # producer-side field that no digest can see fails in CI and not at model
  # load (tests/test_gridbook_attestation_interop.py).
  gridbook-contract:
    name: pinned Gridbook contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch and PrismaQuant
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Install the immutable external Gridbook runtime
        run: |
          read -r repository commit version <<< \
            "$(bash prismaquant/gridbook_runtime/gridbook_runtime.sh print-pin)"
          python -m pip install --no-deps \
            "gridbook @ git+${repository}@${commit}"
          test "$(python -c 'import importlib.metadata as m; print(m.version("gridbook"))')" = "$version"
      - name: Validate producer/runtime compatibility
        env:
          CUDA_VISIBLE_DEVICES: ""
          PRISMAQUANT_REQUIRE_GRIDBOOK_CONTRACT: "1"
        run: |
          pytest tests/test_gridbook_runtime_contract.py \
            tests/test_gridbook_artifact_conformance.py \
            tests/test_gridbook_attestation_interop.py \
            tests/test_profile_export_lanes.py -q --timeout=300 -p no:cacheprovider
